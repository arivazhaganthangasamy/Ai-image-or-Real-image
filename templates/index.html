<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>A Robust Approach for Detecting 
Fake Images Generated by GANs Using 
Multi-Model Techniques
</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Predict</button>
    </form>

    {% if filename %}
    <div class="preview">
        <h3>Uploaded Image</h3>
        <img src="{{ url_for('uploaded_file', filename=filename) }}">
    </div>
    {% endif %}

    {% if prediction %}
    <div class="result">
        <h2>Prediction</h2>
        <span class="badge {{ prediction }}">{{ prediction }}</span>
    </div>
    {% endif %}
</div>

</body>
</html>
